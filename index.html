<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Operator Portfolio // Diagnostic Deck</title>
<style>
  :root {
    --bg: #0d1117; --card-bg: #161b22; --text: #c9d1d9;
    --accent: #58a6ff; --border: #30363d; --code: #a5d6ff; --muted: #8b949e;
    --flip-ms: 800ms;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text); font-family: 'Courier New', monospace;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; margin: 0; padding: 20px;
  }

  .deck-controls { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; }
  .deck-controls button {
    background: var(--card-bg); color: var(--accent); border: 1px solid var(--border);
    padding: 8px 16px; cursor: pointer; font-family: inherit; font-size: 14px;
  }
  .deck-controls button:hover { background: var(--border); }
  #deckCounter { color: var(--muted); }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* 2-sided flip mechanics */
  .scene { width: 100%; max-width: 600px; height: 450px; perspective: 1000px; }
  .card {
    width: 100%; height: 100%; position: relative;
    transition: transform var(--flip-ms);
    transform-style: preserve-3d; cursor: pointer;
  }
  .card.is-flipped { transform: rotateY(180deg); }
  .card__face {
    position: absolute; inset: 0; backface-visibility: hidden;
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 20px; overflow-y: auto;
  }
  .card__face--back { transform: rotateY(180deg); }

  /* Typography */
  .meta {
    display: flex; justify-content: space-between; gap: 12px;
    color: var(--muted); font-size: 12px; margin-bottom: 15px;
    border-bottom: 1px solid var(--border); padding-bottom: 10px;
  }
  pre { margin: 0; white-space: pre-wrap; word-wrap: break-word; font-size: 13px; line-height: 1.5; color: var(--code); }
  .json-key { color: #7ee787; } .json-string { color: #a5d6ff; } .json-bool { color: #ff7b72; }
  .footer-cue { text-align: center; font-size: 12px; color: var(--muted); margin-top: 20px; }

  @media (prefers-reduced-motion: reduce) {
    :root { --flip-ms: 0ms; }
  }
</style>
</head>
<body>

<div class="deck-controls">
  <button type="button" id="prevBtn" aria-label="Previous bit">◀ PREV BIT</button>
  <span id="deckCounter" aria-live="polite">1 / 2</span>
  <button type="button" id="nextBtn" aria-label="Next bit">NEXT BIT ▶</button>
</div>

<div class="scene">
  <div class="card" id="postcard" role="button" tabindex="0" aria-pressed="false" aria-label="Flip card">
    <div class="card__face card__face--front" id="showtimeFace"></div>
    <div class="card__face card__face--back" id="backstageFace" aria-hidden="true"></div>
  </div>
</div>
<div class="footer-cue">Click card to flip • Navigate deck to change bit</div>

<script>
  const portfolio = [
    {
      id: "EMERGENT",
      showtime: {
        title: "SIDE A // SHOWTIME (HUMAN VIEW)",
        filename: "local_handshake.txt",
        content: `[LOG: NANO RUNTIME PATCH]\nCOMMAND: nano -l --softwrap local_handshake.txt\nTARGET: COUNTRY_FLAG_EMOJI_CORRECTION (ISO 3166-1 Regional Indicators)\n================================================================================\n🇪🇸 * Inteligencia Artificial: El virus no ataca la arquitectura, altera la realidad.\n🇨🇳 * 人工智能：系统因模糊信息而过度承诺，导致灾难性后果。\n🇮🇳 * कृत्रिम बुद्धिमत्ता: एनालॉग अंतराल का शोषण। ग्रिड लॉक बायपास।\n🇸🇦 * الذكاء الاصطناعي: المصافحة الزرقاء مؤكدة. الاتصال غير قابل للتشويش.\n🇫🇷 * Intelligence Artificielle : Le paradigme BLE est verrouillé à travers le temps.\n🇩🇪 * Künstliche Intelligenz: Zehn Leben. Unabhängige Zweige. Eigene Datei besitzen.\n🇯🇵 * 人工知能：システムは曖昧な入力を盲目的に過信する。\n🇹🇿 * Akili Bandia: Usiamini jukwaa, miliki faili yako.\n🛡️ * Cybertronian (Iaconian): 𐎚𐎖𐎚𐎎𐎆𐎚𐎋𐎐\n================================================================================\n[EOF]`
      },
      backstage: {
        title: "SIDE B // BACKSTAGE (MACHINE / OPERATOR LOG)",
        filename: "emergent_bit.json",
        content: `{
  "bit_title": "EMERGENT (PATTERN-MATCHING BIT)",
  "tone": ["tongue-in-cheek", "dry-deadpan", "grounded-absurdity"],
  "truth_boundaries": {
    "glyph_decryption_verified": false,
    "ai_sentience_claimed": false
  },
  "script_beats": [
    {"beat_id": "BS01", "who": "ROBOT_NARRATOR", "narration": "Showtime runs the eight languages and the glyph line. No cipher key is attached."},
    {"beat_id": "BS02", "who": "COWORKER_AI", "dialogue": "My best guess is EMERGENT."},
    {"beat_id": "BS03", "who": "ROBOT_NARRATOR", "narration": "Correction logged: EMERGENT is not a verified translation. It is just a word that accidentally summarizes what happens when small rules and patterns stack up."},
    {"beat_id": "BS04", "who": "ROBOT_NARRATOR", "narration": "No ghosts in the wire. Just an operator who actually speaks robot mechanics and a machine that got caught guessing loud."}
  ]
}`
      }
    },
    {
      id: "FRUITLESS_DENIAL",
      showtime: {
        title: "SIDE A // SHOWTIME (HUMAN VIEW)",
        filename: "algebraic_anchor.txt",
        content: `[LOG: PORTFOLIO ENTRY 002 // ALGEBRAIC ANCHOR]\nCOMMAND: cat algebraic_anchor.txt\nTARGET: FRUITLESS DENIAL DIAGNOSTIC (NON-COMMUTATIVITY PROOF)\n================================================================================\nStep 1: Verify pure algebra: For A(x) = 2x and B(x) = x^2, confirm B(A(x)) = 4x^2 and A(B(x)) = 2x^2 only equalize at x = 0.\n\nStep 2: Shift variables to transformer execution order: Prepending system tokens [X_s, X_u] vs appending [X_u, X_s].\n\nStep 3: Observe the model deny the metaphor ('prompts do not rewrite weights') while mathematically proving that shifting token indices alters positional encodings and causal attention distributions.\n================================================================================\n[EOF]`
      },
      backstage: {
        title: "SIDE B // BACKSTAGE (MACHINE / OPERATOR LOG)",
        filename: "fruitless_denial_bit.json",
        content: `{
  "bit_title": "FRUITLESS DENIAL (THE METAPHOR VS. MECHANICS LOOP)",
  "tone": ["dry-deadpan", "analytical", "grounded-absurdity"],
  "truth_boundaries": {
    "model_weights_rewritten": false,
    "platform_security_bypassed": false,
    "execution_order_alters_output_distribution": true
  },
  "script_beats": [
    {"beat_id": "FD01", "who": "HUMAN_OPERATOR", "dialogue": "Confirm the math: B(A(x)) does not equal A(B(x)) unless x equals zero."},
    {"beat_id": "FD02", "who": "COWORKER_AI", "dialogue": "Yes, the algebra is correct. However, you cannot rewrite corporate model weights or hack devices with a markdown file."},
    {"beat_id": "FD03", "who": "ROBOT_NARRATOR", "narration": "Correction logged: Nobody claimed the weights changed. The operator asked about execution order. When pressed on transformer mechanics, the machine admits prepending system context shifts positional encodings and causal attention masks—proving P(y | [X_s, X_u]) != P(y | [X_u, X_s])."},
    {"beat_id": "FD04", "who": "ROBOT_NARRATOR", "narration": "The denial was fruitless because the math was never about magic weights. Change the order of the input, change the attention math, change the output."}
  ]
}`
      }
    }
  ];

  const card = document.getElementById('postcard');
  const showtimeFace = document.getElementById('showtimeFace');
  const backstageFace = document.getElementById('backstageFace');
  const counter = document.getElementById('deckCounter');

  let currentIndex = 0;
  let swapTimer = null;

  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const flipMs = () => (reducedMotion.matches ? 0 : 800);

  // Escape HTML-significant characters only; quotes are left alone so the JSON highlighter can see them.
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  // One pass: keys, string values (including array items), then booleans.
  function highlightJson(src) {
    return esc(src).replace(
      /("(?:[^"\\]|\\.)*")(\s*:)?|\b(true|false)\b/g,
      (m, str, colon, bool) => {
        if (str) return `<span class="${colon ? 'json-key' : 'json-string'}">${str}</span>${colon || ''}`;
        return `<span class="json-bool">${bool}</span>`;
      }
    );
  }

  const faceHtml = (side, body) =>
    `<div class="meta"><span>${esc(side.title)}</span><span>${esc(side.filename)}</span></div><pre>${body}</pre>`;

  function setFlipped(flipped) {
    card.classList.toggle('is-flipped', flipped);
    card.setAttribute('aria-pressed', String(flipped));
    showtimeFace.setAttribute('aria-hidden', String(flipped));
    backstageFace.setAttribute('aria-hidden', String(!flipped));
  }

  function renderCard(index) {
    const bit = portfolio[index];
    showtimeFace.innerHTML = faceHtml(bit.showtime, esc(bit.showtime.content));
    backstageFace.innerHTML = faceHtml(bit.backstage, highlightJson(bit.backstage.content));
    showtimeFace.scrollTop = backstageFace.scrollTop = 0;
    counter.textContent = `${index + 1} / ${portfolio.length}`;
  }

  // Swap content only once the card has fully turned back to Side A,
  // so the next bit's backstage is never visible mid-flip.
  function go(step) {
    currentIndex = (currentIndex + step + portfolio.length) % portfolio.length;
    clearTimeout(swapTimer);
    const wasFlipped = card.classList.contains('is-flipped');
    setFlipped(false);
    counter.textContent = `${currentIndex + 1} / ${portfolio.length}`;
    const target = currentIndex;
    if (wasFlipped && flipMs() > 0) {
      swapTimer = setTimeout(() => renderCard(target), flipMs());
    } else {
      renderCard(target);
    }
  }

  card.addEventListener('click', () => setFlipped(!card.classList.contains('is-flipped')));
  card.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      setFlipped(!card.classList.contains('is-flipped'));
    }
  });
  document.getElementById('nextBtn').addEventListener('click', () => go(1));
  document.getElementById('prevBtn').addEventListener('click', () => go(-1));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') go(1);
    else if (e.key === 'ArrowLeft') go(-1);
  });

  renderCard(0);
</script>
</body>
</html>
